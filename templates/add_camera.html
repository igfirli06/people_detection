<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Camera</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            color: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 1.8rem;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 1rem;
            color: #333;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.2);
            outline: none;
        }

        button {
            background-color: #4a90e2;
            color: white;
            padding: 14px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        a.back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #4a90e2;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        a.back-link:hover {
            color: #357abd;
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Add New Camera</h1>

        <form id="cameraForm" method="post" action="{{ url_for('add_camera') }}">
            <label for="name">Camera Name</label>
            <input type="text" id="name" name="name" placeholder="Enter camera name" />

            <label for="rtsp_url">RTSP URL</label>
            <input type="url" id="rtsp_url" name="rtsp_url" placeholder="rtsp://example.com/stream" />

            <button type="submit">Add Camera</button>
        </form>

        <div id="message" class="message"></div>

        <a href="{{ url_for('index') }}" class="back-link">Kembali ke halaman utama</a>
    </div>

    <script>
        document.getElementById("cameraForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Cegah submit default

            const name = document.getElementById("name").value.trim();
            const rtsp = document.getElementById("rtsp_url").value.trim();
            const message = document.getElementById("message");

            // regex sederhana untuk RTSP
            const rtspRegex = /^rtsp:\/\/.+/;

            if (!name && !rtsp) {
                message.textContent = "Harap isi Nama kamera dan link!";
                message.className = "message error";
            } else if (name && !rtsp) {
                message.textContent = "Harap isi link rtsp!";
                message.className = "message error";
            } else if (!name && rtsp) {
                message.textContent = "Harap isi Nama kamera!";
                message.className = "message error";
            } else if (!rtspRegex.test(rtsp)) {
                message.textContent = "Maaf Nama kamera dan Link Rtsp salah! Contoh: rtsp://admin:kutaitimber121@192.168.1.64:554/Streaming/Channels/101";
                message.className = "message error";
            } else {
                message.textContent = "Sukses!";
                message.className = "message success";

                // Jika valid, baru submit form
                this.submit();
            }
        });
    </script>
</body>
</html>
