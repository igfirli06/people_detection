<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Zona Kamera {{ camera.id }} - {{ camera.name }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-color: #4A90E2;
            --secondary-color: #3B7DC4;
            --background-light: #F0F4F8;
            --surface-card: #FFFFFF;
            --text-main: #2C3E50;
            --text-secondary: #7F8C8D;
            --border-color: #EAECEE;
            --success-color: #2ECC71;
            --success-hover: #27AE60;
            --danger-color: #E74C3C;
            --danger-hover: #C0392B;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-light);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            text-align: center;
            width: 95%;
            max-width: 650px;
            box-sizing: border-box;
            transition: box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: var(--shadow-hover);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 1.8rem;
        }
        
        .image-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .image-container img {
            width: 100%;
            display: block;
            border-radius: 8px;
        }

        .canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #coords-display {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            background-color: #F8F9FA;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
        }
        
        #coordinates {
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-main);
            font-weight: 600;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--success-color), #28B463);
            color: white;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }

        .btn-save:hover {
            background: linear-gradient(135deg, var(--success-hover), #229954);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(46, 204, 113, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color), #CB4335);
            color: white;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, var(--danger-hover), #A93226);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(231, 76, 60, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Zona untuk <br/>{{ camera.name }}</h1>

        <div class="image-container">
            <img id="video-feed" src="{{ url_for('video_feed', camera_id=camera.id) }}" alt="Video Feed">
            <canvas id="drawing-canvas" class="canvas-overlay"></canvas>
        </div>

        <div id="coords-display">
            Koordinat: <span id="coordinates">{% if current_zone %}{{ current_zone|tojson }}{% else %}[]{% endif %}</span>
        </div>
        
        <div class="button-group">
            <form id="save-form" method="POST" action="{{ url_for('set_zone', camera_id=camera.id) }}" style="display:inline;">
                <input type="hidden" name="zone_coordinates" id="zone-input" value="{{ current_zone|tojson }}">
                <button type="submit" class="btn btn-save">Simpan Zona</button>
            </form>
            <form id="delete-form" method="POST" action="{{ url_for('delete_zone', camera_id=camera.id) }}" style="display:inline;">
                <button type="submit" class="btn btn-danger">Hapus Zona</button>
            </form>
        </div>

        <p><a href="{{ url_for('index') }}" style="color: var(--primary-color); text-decoration: none; font-weight: 600; margin-top: 20px; display: inline-block;">&larr; Kembali ke Halaman Utama</a></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('drawing-canvas');
            const videoFeed = document.getElementById('video-feed');
            const coordsDisplay = document.getElementById('coordinates');
            const zoneInput = document.getElementById('zone-input');
            const saveForm = document.getElementById('save-form');

            const ctx = canvas.getContext('2d');
            let points = [];
            
            try {
                const initialCoords = JSON.parse(zoneInput.value);
                if (Array.isArray(initialCoords)) {
                    points = initialCoords;
                }
            } catch (e) {
                console.error("Failed to parse initial coordinates.");
            }

            coordsDisplay.textContent = JSON.stringify(points);

            function resizeCanvas() {
                canvas.width = videoFeed.naturalWidth;
                canvas.height = videoFeed.naturalHeight;
                canvas.style.width = videoFeed.offsetWidth + 'px';
                canvas.style.height = videoFeed.offsetHeight + 'px';
                redraw();
            }

            function redraw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (points.length > 1) {
                    ctx.strokeStyle = '#FFFF00'; 
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(points[0][0], points[0][1]);
                    for (let i = 1; i < points.length; i++) {
                        ctx.lineTo(points[i][0], points[i][1]);
                    }
                    if (points.length > 2) {
                        ctx.closePath();
                    }
                    ctx.stroke();
                }
            }

            canvas.addEventListener('click', function(event) {
                if (points.length === 0) {
                    points = [];
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                const scaledX = Math.round((x / rect.width) * videoFeed.naturalWidth);
                const scaledY = Math.round((y / rect.height) * videoFeed.naturalHeight);

                points.push([scaledX, scaledY]);
                
                coordsDisplay.textContent = JSON.stringify(points);
                zoneInput.value = JSON.stringify(points);
                
                redraw();
            });

            saveForm.addEventListener('submit', function(event) {
                if (points.length < 3) {
                    event.preventDefault();
                    alert("Zona harus memiliki minimal 3 titik. Silakan buat zona terlebih dahulu.");
                }
            });

            videoFeed.onload = function() {
                resizeCanvas();
                redraw();
            };
            window.addEventListener('resize', resizeCanvas);

            if (videoFeed.complete) {
                videoFeed.onload();
            }
        });
    </script>
</body>
</html>
